# Response headers that constrain what the browser will do with this app.
#
# A separate file because of one nginx rule that catches everybody: `add_header` in a
# `location` block does not add to the ones inherited from `server`, it **replaces** them.
# Two locations in nginx.conf set their own Cache-Control, so headers written once at server
# level would silently vanish from exactly the two responses that matter most — index.html
# and the JavaScript bundle. Including this file in each of them is the version that cannot
# rot: adding a location without the include is visible, whereas losing an inherited header
# is not.
#
# `always` on every line, so these are present on error responses too. A 404 or a 502 is
# still a document a browser will render.

# The Content-Security-Policy. Worth reading rather than copying, because two of these
# entries are load-bearing and two are concessions:
#
#   default-src 'self'    everything not named below comes from this origin only.
#   script-src  'self'    no inline scripts, no eval. This is the entry that turns a
#                         successful HTML injection from account takeover into broken
#                         markup, and it is only affordable because the Vite build emits
#                         index.html with a single external module and nothing inline.
#   style-src             'self' plus fonts.googleapis.com, which is a concession: the CSS
#                         bundle begins with `@import "https://fonts.googleapis.com/..."`
#                         (see apps/web/src/index.css), so a stricter value would leave the
#                         app rendering in the fallback sans-serif.
#   font-src              'self' plus fonts.gstatic.com, which is where the stylesheet that
#                         concession fetches then points for the font files themselves.
#   img-src               'self' and data:, for the small assets Vite inlines.
#   connect-src 'self'    the API and the Centrifugo WebSocket are both same-origin through
#                         this proxy, and 'self' covers ws:// on the document's own host.
#                         If realtime is ever moved to its own hostname, this is the line
#                         that will refuse to connect to it.
#   frame-ancestors       nothing may frame this app, which is the clickjacking defence.
#   base-uri 'self'       an injected <base> tag cannot repoint every relative URL.
#   form-action 'self'    an injected form cannot post the user's input somewhere else.
#   object-src 'none'     no plugins, ever.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# For browsers older than frame-ancestors. Redundant with the CSP above and cheap to keep.
add_header X-Frame-Options "DENY" always;

# Stop the browser guessing a response's type from its bytes. Without it, a file a user
# uploaded and a server labelled text/plain can be sniffed as HTML and executed.
add_header X-Content-Type-Options "nosniff" always;

# Send the full URL only to this origin. Goal and task IDs live in the path, and a
# cross-origin request — the Google Fonts one above, or any link a user follows — has no
# business learning which goal they were looking at.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Features this app does not use. Denying them means a compromised bundle cannot quietly
# turn one on, and it costs nothing to state.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Deliberately absent: Strict-Transport-Security. This server listens on plain http and is
# expected to sit behind something that terminates TLS; a browser ignores HSTS on an http
# response, so setting it here would be decoration. It belongs on the terminator, which is
# the only component that knows https actually works for this hostname — and getting that
# wrong with includeSubDomains is not a mistake a max-age lets you take back quickly.

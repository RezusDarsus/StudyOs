# nginx in front of the built web application.
#
# This file is what makes production same-origin, and that is its main job rather than a
# side effect. The browser only ever talks to this server: static files come off disk,
# /api is proxied to the API container, /connection/websocket to Centrifugo. There is no
# CORS configuration here because with one origin there is no cross-origin request to
# permit — which is the point. The session cookie is HttpOnly and SameSite=Lax and would
# not be sent on a cross-origin XHR at all; the alternative, CORS with credentials, means
# an allowlist that has to be right in three places instead of none.
#
# `api` and `centrifugo` are docker-compose service names, resolved by Docker's embedded
# DNS on the project network. nginx resolves them once at startup and exits if it cannot,
# which is why the compose file makes this container wait for both to be healthy.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nothing gained by telling a scanner the exact version.
    server_tokens off;

    # Applies to every response that does not set headers of its own — /api/ and the
    # WebSocket below. The two locations that do set their own include it again, because
    # nginx replaces inherited add_headers rather than adding to them.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The API. The /api prefix is passed through unchanged — the server registers every
    # route under it, so rewriting it away here would 404 all of them.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, deliberately not $proxy_add_x_forwarded_for. The usual directive
        # appends to whatever the client sent, so a request carrying its own
        # `X-Forwarded-For: 9.9.9.9` arrives at the API as `9.9.9.9, <real client>` — and
        # the API runs with TRUST_PROXY=true, which means it would believe the left-hand
        # entry. Every per-address rate limit in routes/auth.ts would then be bypassable by
        # sending a header. Overwriting makes this header say exactly one thing: the address
        # nginx accepted the connection from, which is the only one it can vouch for.
        #
        # If a load balancer is ever put in front of this nginx, that terminator becomes the
        # thing that knows the real client, and this line needs the realip module
        # (set_real_ip_from / real_ip_header) rather than a return to appending.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The Copilot streams, and buffering would hold each chunk back until the end.
        proxy_buffering off;
        # It also waits on a model provider, which is far slower than the default 60s
        # allows for. Everything else here answers in milliseconds and is unaffected.
        proxy_read_timeout 120s;
    }

    # Centrifugo's WebSocket endpoint. The Upgrade headers are the whole reason this block
    # exists: without them nginx answers the handshake itself, with a 400.
    location /connection/websocket {
        proxy_pass http://centrifugo:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        # Forwarded unmodified on purpose. Centrifugo checks it against its allowed
        # origins, and that check is what stops another site opening sockets here — so
        # rewriting this header would quietly disable it.
        proxy_set_header Origin     $http_origin;
        proxy_set_header X-Real-IP  $remote_addr;
        # Overwritten rather than appended, for the reason given in the /api/ block above.
        proxy_set_header X-Forwarded-For $remote_addr;
        # A socket with nothing to say is the normal state for this app: notifications are
        # occasional. The default 60s read timeout would close every idle connection.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vite writes a content hash into these filenames, so a given URL's bytes can never
    # change and a year is not a risk. One header rather than `expires` as well, which
    # would emit a second, competing Cache-Control alongside this one.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page application, which owns its own routing: a reload
    # on /app/goals/<id> has to be answered with index.html rather than a 404.
    #
    # index.html itself must not be cached. It is the file that names the current hashed
    # bundles, so a stale copy points the browser at bundles the last deploy deleted.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
